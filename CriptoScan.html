<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Scanner & KeyGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliotecas para Scanner e API -->
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        #preview {
            width: 100%;
            height: 300px;
            background: #1a202c;
            border-radius: 0.75rem;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl p-6 space-y-6">
        <header class="text-center">
            <h1 class="text-2xl font-bold text-blue-400">Crypto Wallet Tool</h1>
            <p class="text-gray-400 text-sm">Scanner QR & Geração de Chaves</p>
        </header>

        <!-- Seção do Scanner -->
        <section class="space-y-4">
            <h2 class="text-lg font-semibold border-b border-gray-700 pb-2">Scanner de Endereço</h2>
            <video id="preview" class="shadow-lg"></video>
            <div class="bg-gray-700 p-3 rounded-lg break-all">
                <span class="text-xs text-gray-400 block">Endereço Escaneado:</span>
                <p id="scanned-result" class="text-green-400 font-mono text-sm">Aguardando scan...</p>
            </div>
        </section>

        <!-- Seção de Geração de Chave -->
        <section class="space-y-4">
            <h2 class="text-lg font-semibold border-b border-gray-700 pb-2">Nova Carteira (BlockCypher)</h2>
            <button onclick="generateWallet()" id="gen-btn" class="w-full bg-blue-600 hover:bg-blue-700 transition p-3 rounded-lg font-bold">
                Gerar Nova Chave Privada
            </button>

            <div id="wallet-result" class="hidden bg-gray-900 p-4 rounded-lg space-y-3 border border-blue-500/30">
                <div>
                    <span class="text-xs text-gray-400 block">Endereço Público:</span>
                    <p id="res-addr" class="text-sm font-mono text-blue-300 break-all"></p>
                </div>
                <div>
                    <span class="text-xs text-red-400 block font-bold">CHAVE PRIVADA (WIF):</span>
                    <p id="res-priv" class="text-sm font-mono text-yellow-500 break-all"></p>
                </div>
            </div>
        </section>
    </div>

    <footer class="mt-8 text-gray-500 text-xs">
        Powered by BlockCypher API & Instascan
    </footer>

    <script>
        // --- Lógica do Scanner QR ---
        let scanner = new Instascan.Scanner({ video: document.getElementById('preview'), mirror: false });
        
        scanner.addListener('scan', function (content) {
            document.getElementById('scanned-result').innerText = content;
            // Feedback tátil simples (se suportado pelo Android)
            if (navigator.vibrate) navigator.vibrate(100);
        });

        Instascan.Camera.getCameras().then(function (cameras) {
            if (cameras.length > 0) {
                // Tenta usar a câmera traseira no Android (geralmente a última da lista)
                let selectedCam = cameras.length > 1 ? cameras[1] : cameras[0];
                scanner.start(selectedCam);
            } else {
                console.error('Nenhuma câmera encontrada.');
                document.getElementById('scanned-result').innerText = "Erro: Câmera não detectada.";
            }
        }).catch(function (e) {
            console.error(e);
        });

        // --- Lógica da API BlockCypher ---
        async function generateWallet() {
            const btn = document.getElementById('gen-btn');
            const resultDiv = document.getElementById('wallet-result');
            
            btn.innerText = "Gerando...";
            btn.disabled = true;

            try {
                // Endpoint público da BlockCypher para BTC Mainnet
                // NOTA: Em produção real, use seu token (?token=SEU_TOKEN)
                const response = await axios.post('https://api.blockcypher.com/v1/btc/main/addrs');
                
                document.getElementById('res-addr').innerText = response.data.address;
                document.getElementById('res-priv').innerText = response.data.private; // Esta é a chave em Hex
                
                resultDiv.classList.remove('hidden');
                btn.innerText = "Gerar Nova Chave Privada";
                btn.disabled = false;
            } catch (error) {
                alert("Erro ao conectar com BlockCypher. Verifique sua conexão.");
                btn.innerText = "Tentar Novamente";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
